<!doctype html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Accessories | Studio Shop</title>
    <link rel="stylesheet" href="style.css" />
    <script src="productlist.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <a class="logo" href="index.html">STUDIO SHOP<span> / </span></a>
      <nav class="header-nav" aria-label="Hovednavigation"><a href="index.html">Kategorier</a><a href="productlist.html" aria-current="page">Accessories</a></nav>
    </header>
    <main>
      <p class="eyebrow"><a href="index.html">Kategorier</a> / Kollektionen</p>
      <div class="page-heading">
        <h1>Accessories</h1>
        <p>Find det, der passer til din stil.</p>
      </div>
      <div class="filter-bar" aria-label="Filtrer produkter efter køn">
        <span>Vis</span>
        <button class="filter-button active" type="button" aria-pressed="true">All</button>
        <button class="filter-button" type="button" aria-pressed="false">Unisex</button>
        <button class="filter-button" type="button" aria-pressed="false">Women</button>
        <button class="filter-button" type="button" aria-pressed="false">Men</button>
      </div>
      <p id="status" role="status">Henter produkter…</p>
      <button id="retry" type="button" hidden>Prøv igen</button>
      <section class="product_list_container" aria-label="Produkter" aria-busy="true"></section>
      <noscript>Slå JavaScript til for at se produkterne.</noscript>
    </main>
    <footer>STUDIO SHOP</footer>
  </body>
</html>
